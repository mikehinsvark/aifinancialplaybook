  <path d="M51.5 19.5c-6.8-3.5-13-2.2-19.5 2.2v29.1c6.5-4.2 12.7-5.7 19.5-2.3V19.5Z" fill="#102D50" stroke="#80E3FF" stroke-opacity=".78" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M18 41.2 25.5 34 31.1 37.3 43.8 24.8" fill="none" stroke="url(#data)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m38.3 24.7 5.6.1-.1 5.6" fill="none" stroke="#A8EEFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25.5" cy="34" r="1.7" fill="#E6FAFF"/>
  <circle cx="31.1" cy="37.3" r="1.7" fill="#E6FAFF"/>
