<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI FinServ Playbook</title>
  <desc id="desc">An open financial playbook with an ascending AI data line.</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="5" x2="56" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B52"/>
      <stop offset="1" stop-color="#07172D"/>
    </linearGradient>
    <linearGradient id="data" x1="18" y1="43" x2="45" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46D9FF"/>
      <stop offset="1" stop-color="#7E8CFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#5BCBFF" stroke-opacity=".34" stroke-width="1.5"/>
